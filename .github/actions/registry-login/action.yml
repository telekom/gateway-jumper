name: Registry login
description: >-
  Install crane and cosign and authenticate them against the container registry.
  Both tools read the same Docker credential store, so a single login covers them.

inputs:
  registry:
    description: Container registry host to authenticate against.
    required: true
  username:
    description: Container registry username.
    required: true
  password:
    description: Container registry password or token.
    required: true

runs:
  using: composite
  steps:
    - name: Install crane
      uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b #v0.7
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 #v4.1.2
      with:
        cosign-release: "v2.5.3"
    - name: Log in to the container registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        REGISTRY_USER: ${{ inputs.username }}
        REGISTRY_PASSWORD: ${{ inputs.password }}
      run: |
        # crane and cosign both use the Docker credential store, so logging in once
        # with crane also authenticates cosign.
        printf '%s' "${REGISTRY_PASSWORD}" |
          crane auth login "${REGISTRY}" --username "${REGISTRY_USER}" --password-stdin
