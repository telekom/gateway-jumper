name: Push container image

# This workflow runs after the Build workflow completes.
# It downloads the pre-built image artifact and pushes it to the registry.
#
# For fork PRs, the "external" environment approval gate ensures a maintainer
# reviews the fork's code before the image is pushed with access to secrets.
# For internal PRs and other events, no approval is required.
#
# Security: This workflow never checks out fork code. It only handles
# the pre-built artifact from the Build workflow.

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  push-image:
    name: Push container image
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: ${{ github.event.workflow_run.event == 'pull_request'
      && github.event.workflow_run.head_repository.full_name != github.repository
      && 'external' || '' }}
    env:
      GITHUB_REF_ORIGIN: ${{ github.event.workflow_run.head_ref }}
      GITHUB_REF_BRANCH: ${{ github.event.workflow_run.head_branch }}
      GITHUB_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
    steps:
      - name: Cache maven target dir
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae #v5.0.5
        with:
          path: target
          key: ${{ runner.os }}-maven-target-${{ github.event.workflow_run.head_sha || github.sha }}
          restore-keys: |
            ${{ runner.os }}-maven-target-${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Check secret access
        run: |
          echo "Github ref: $GITHUB_REF_ORIGIN"
          echo "Github branch: $GITHUB_REF_BRANCH"
          echo "Github head sha: $GITHUB_HEAD_SHA"
          if [[ "${{ github.event.workflow_run.event }}" == "pull_request" ]]; then
            echo "Event is pull_request"
            echo "PR number: $PR_NUMBER"
          else
            echo "Event is not pull_request"
          fi
          if [ -n "$TEST_SECRET" ]; then
            echo "Secret is accessible - would push image"
          else
            echo "Secret is NOT accessible"
            exit 1
          fi
        env:
          TEST_SECRET: ${{ secrets.TEST_SECRET }}
      - name: print artifact contents
        run: |
          echo "Artifact contents:"
          ls -la target
          cat target/test-artifact.txt
