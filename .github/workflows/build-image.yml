name: Build, push & scan container image

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment to use (controls secrets access and approval gates)"
        required: true
        type: string

jobs:
  build-push:
    name: Build & push container image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check secret access
        run: |
          if [ -n "${{ secrets.TEST_SECRET }}" ]; then
            echo "Secret is accessible"
          else
            echo "Secret is NOT accessible"
            exit 1
          fi
